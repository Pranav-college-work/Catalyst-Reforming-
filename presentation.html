<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalytic Cracking Slides</title>
<meta name="description" content="Catalytic cracking presentation, Group 3: 17 slides with keyboard navigation and full screen.">
<style>
:root{--bg:#0D0F11;--bar:#15181B;--ink:#E9E7E2;--ink2:#9BA1A8;--rule:#2A2F35;--accent:#F0804F}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px "Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bar);border-bottom:2px solid var(--accent);flex-wrap:wrap}
header b{font-size:17px;margin-right:auto}
header b small{font-weight:400;color:var(--ink2);margin-left:8px}
.btn{font:600 14px "Segoe UI",Arial,sans-serif;color:var(--ink);background:#1F2428;border:1px solid #3A4048;border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#2A3036}
.btn.go{background:var(--accent);border-color:var(--accent);color:#16110E}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;position:relative}
.stage img{max-width:100%;max-height:100%;background:#fff;border-radius:4px;box-shadow:0 6px 30px rgba(0,0,0,.5);user-select:none}
.hit{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;cursor:pointer}
.hit.l{left:0}.hit.r{right:0}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bar);border-top:1px solid var(--rule)}
.bar .ti{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.bar .ti b{color:var(--ink)}
.count{font:600 14px Consolas,monospace;min-width:64px;text-align:center}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:#0A0C0D}
.thumbs button{flex:none;padding:0;border:2px solid transparent;border-radius:5px;background:none;cursor:pointer;position:relative;line-height:0}
.thumbs img{width:112px;height:63px;border-radius:3px;display:block;opacity:.6}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs button[aria-current="true"] img,.thumbs button:hover img{opacity:1}
.thumbs span{position:absolute;left:3px;top:3px;font:700 10px Consolas,monospace;background:rgba(0,0,0,.75);color:#fff;padding:1px 4px;border-radius:3px;line-height:1.3}
body.fs header,body.fs .thumbs,body.fs .bar{display:none}
body.fs .stage{padding:0;background:#000}
body.fs .stage img{border-radius:0;box-shadow:none}
@media (max-width:640px){header b small,.keys{display:none}.thumbs img{width:80px;height:45px}}
</style>
</head>
<body>
<header>
  <b>Catalytic Cracking <small>Group 3 · Petroleum Refinery Engineering</small></b>
  <a class="btn" href="index.html">Home</a>
  <a class="btn" href="qna.html">Q&amp;A prep</a>
  <a class="btn" href="video.html">Video</a>
  <a class="btn" href="Catalytic_Cracking_Unit.pptx" download>Download .pptx</a>
  <button class="btn go" id="full" type="button">Present full screen (F)</button>
</header>
<div class="stage">
  <img id="slide" src="slides/slide-01.jpg" alt="Slide 1">
  <button class="hit l" id="hl" type="button" aria-label="Previous slide"></button>
  <button class="hit r" id="hr" type="button" aria-label="Next slide"></button>
</div>
<div class="bar">
  <button class="btn" id="prev" type="button">← Prev</button>
  <span class="count" id="count">1 / 17</span>
  <button class="btn" id="next" type="button">Next →</button>
  <span class="ti" id="ti"></span>
  <span class="keys" style="color:var(--ink2);font-size:13px">← → Space · F full screen · Home / End</span>
</div>
<nav class="thumbs" id="thumbs" aria-label="Slides"></nav>
<script>
const T=["Title","What catalytic cracking is","Objective and role in the refinery","Thermal vs catalytic cracking","Reactor types: fixed, moving, fluidised bed","FCC configurations and evolution","Modern variants","Operating conditions","Process specifications","Feed and contaminants","Catalyst","Reactions in FCC","Reaction mechanism","Block flow diagram","Process flow diagram","Optimising catalytic cracking","Products"];
const N=T.length, pad=n=>String(n).padStart(2,'0');
const img=document.getElementById('slide'), thumbs=document.getElementById('thumbs');
let i=Math.max(0,Math.min(N-1,(parseInt(location.hash.slice(1))||1)-1));
T.forEach((t,k)=>{const b=document.createElement('button');b.type='button';b.title=(k+1)+'. '+t;
  b.innerHTML='<img loading="lazy" src="slides/thumb-'+pad(k+1)+'.jpg" alt="Slide '+(k+1)+': '+t+'"><span>'+(k+1)+'</span>';
  b.onclick=()=>show(k);thumbs.append(b)});
function show(k){i=Math.max(0,Math.min(N-1,k));img.src='slides/slide-'+pad(i+1)+'.jpg';img.alt='Slide '+(i+1)+': '+T[i];
  document.getElementById('count').textContent=(i+1)+' / '+N;
  document.getElementById('ti').innerHTML='<b>'+(i+1)+'.</b> '+T[i];
  [...thumbs.children].forEach((b,n)=>b.setAttribute('aria-current',n===i));
  const b=thumbs.children[i];thumbs.scrollLeft=b.offsetLeft-thumbs.clientWidth/2+b.offsetWidth/2;
  history.replaceState(null,'','#'+(i+1));
  if(i+1<N){new Image().src='slides/slide-'+pad(i+2)+'.jpg'}}
async function full(){try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(e){}}
document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fs',!!document.fullscreenElement));
['prev','hl'].forEach(id=>document.getElementById(id).onclick=()=>show(i-1));
['next','hr'].forEach(id=>document.getElementById(id).onclick=()=>show(i+1));
document.getElementById('full').onclick=full;
addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey)return;const k=e.key;
  if(['ArrowRight','PageDown',' ','Enter'].includes(k)){e.preventDefault();show(i+1)}
  else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();show(i-1)}
  else if(k==='Home')show(0);else if(k==='End')show(N-1);else if(k==='f'||k==='F')full()});
show(i);
</script>
</body>
</html>
