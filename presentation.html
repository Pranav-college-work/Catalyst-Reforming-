const slides=[{"title": "Catalytic cracking unit", "section": "Petroleum Refining Engineering · 1 October", "source": "[L] pp. 14–16  ·  [B] §§8.1–8.3, pp. 199–202", "notes": "Lecture: Cracking and Reforming 1, supplied course PDF, pp. 14–16. Fahim, M. A., Al-Sahhaf, T. A., and Elkilani, A. S. (2010). Fundamentals of Petroleum Refining. Elsevier. Chapter 8, pp. 199–235. Printed page numbers are used. PDF page = printed page + 17.\nFCC converts heavy gas oils into lower molecular weight products using acidic catalyst. No external hydrogen is added to the FCC reaction loop. Coke is the carbon rejection route and is burned in the regenerator. Diagram is an original simplified block flow based on textbook Fig. 8.1 and the lecture.\nPresent the refinery objective, then follow the catalyst and oil paths."}, {"title": "Types of catalytic cracking", "section": "01 · Unit and types", "source": "[L] pp. 14–18  ·  [B] §8.8, pp. 209–210", "notes": "Lecture: Cracking and Reforming 1, supplied course PDF, pp. 14–18. Fahim, M. A., Al-Sahhaf, T. A., and Elkilani, A. S. (2010). Fundamentals of Petroleum Refining. Elsevier. Chapter 8, pp. 199–235. Printed page numbers are used. PDF page = printed page + 17., section 8.8. Fixed bed Houdry units alternated reaction and regeneration. Moving bed TCC circulated larger catalyst beads. FCC circulates fine powder continuously. Side-by-side and stacked/Orthoflow describe FCC vessel arrangements, not different reaction mechanisms. RFCC is a residue-feed adaptation. Hydrocracking is a separate hydrogen-addition process and is outside the scope of this deck."}, {"title": "Feedstock and catalyst", "section": "02 · Materials", "source": "[L] pp. 12–16, 20  ·  [B] §§8.3, 8.7, pp. 200–201, 208–209", "notes": "Lecture: Cracking and Reforming 1, supplied course PDF, pp. 12–16 and 20. Fahim, M. A., Al-Sahhaf, T. A., and Elkilani, A. S. (2010). Fundamentals of Petroleum Refining. Elsevier. Chapter 8, pp. 199–235. Printed page numbers are used. PDF page = printed page + 17., sections 8.3 and 8.7. Gas oil boiling range is a feed distillation range, not reactor temperature. The lecture gives about 70 micrometres and the book about 75 micrometres for catalyst particles. Zeolite Y is the acid cracking component. Matrix, binder and kaolin contribute accessibility and particle strength. ZSM-5 is an additive used to increase light olefins and gasoline octane, with a gasoline yield trade-off. Hydrotreating reduces sulfur, nitrogen and metals. The lecture misspells a rare-earth example as cesium; that example is intentionally not reproduced. Nickel promotes hydrogen and coke formation, whereas vanadium damages zeolite activity."}, {"title": "Operating conditions", "section": "03 · Conditions", "source": "[L] p. 13  ·  [B] p. 208; Table 8.4, p. 212  ·  SI values converted from the book", "notes": "Lecture: Cracking and Reforming 1, supplied course PDF, p. 13 gives a contact time of about 1–4 s. Fahim, M. A., Al-Sahhaf, T. A., and Elkilani, A. S. (2010). Fundamentals of Petroleum Refining. Elsevier. Chapter 8, pp. 199–235. Printed page numbers are used. PDF page = printed page + 17., p. 208 gives 480–550 °C. Table 8.4 is one maximum-gasoline case, not a universal design range: 446 °F feed, 991 °F riser outlet, 1341 °F regenerator, 30 psig reactor, 33 psig regenerator, catalyst/oil 5.4 and 0.9 wt% dispersion steam. Conversions: Celsius=(Fahrenheit−32)/1.8; barg=psig×0.0689476; absolute pressure uses atmospheric pressure 1.01325 bar. 30 psig=2.068 barg=3.082 bara and 33 psig=2.275 barg=3.289 bara. Do not combine this case with the separate geometry example on slide 8 as one plant design."}, {"title": "Block flow diagram of FCC", "section": "04 · Schematic diagram", "source": "[L] pp. 15–17, Fig. 4.11  ·  [B] Fig. 8.7, p. 211  ·  Original simplified BFD", "notes": "Lecture: Cracking and Reforming 1, supplied course PDF, pp. 15–17 and Fig. 4.11. Fahim, M. A., Al-Sahhaf, T. A., and Elkilani, A. S. (2010). Fundamentals of Petroleum Refining. Elsevier. Chapter 8, pp. 199–235. Printed page numbers are used. PDF page = printed page + 17., Fig. 8.7, p. 211. Follow the oil: feed preheat, riser, disengager, fractionator, gas recovery. Follow the catalyst: disengager, steam stripper, regenerator, riser. Hot regenerated catalyst supplies heat for feed vaporisation and endothermic cracking. Steam removes adsorbed hydrocarbons from spent catalyst before air regeneration. Cyclones separate solids in the disengager and regenerator. Blue dashed lines denote steam, orange the hot catalyst return, grey the spent catalyst/flue gas and green the lighter hydrocarbon streams. The diagram omits detailed overhead condensers, reflux, recycle, valves and controls. It is a block flow diagram, not a detailed P&ID. Gas recovery also recovers light gasoline; its gasoline joins the gasoline pool. The coke burn flue gas does not enter the hydrocarbon gas recovery unit."}, {"title": "Reactions in FCC", "section": "05 · Reaction chemistry", "source": "[L] pp. 9–13, 24  ·  [B] §§8.5–8.6, pp. 202–208", "notes": "Lecture: Cracking and Reforming 1, supplied course PDF, pp. 9–13 and 24. Fahim, M. A., Al-Sahhaf, T. A., and Elkilani, A. S. (2010). Fundamentals of Petroleum Refining. Elsevier. Chapter 8, pp. 199–235. Printed page numbers are used. PDF page = printed page + 17., sections 8.5 and 8.6. The equations are representative balanced examples rather than a unique overall FCC stoichiometry. Cracking of paraffins yields a smaller paraffin and olefin. Hydrogen transfer is illustrated using three propene molecules and a cyclohexane donor: three propane molecules plus benzene result. Isomerisation enriches branched hydrocarbons. Aromatic side chains can crack while aromatic rings are comparatively resistant. Condensation and hydrogen loss lead to polyaromatic coke. Regeneration equation treats coke as carbon for simplicity; real coke contains hydrogen and other elements and partial CO combustion can occur. Overall cracking is endothermic and coke combustion is exothermic."}, {"title": "Reaction mechanism", "section": "06 · Carbenium-ion pathway", "source": "[L] pp. 11–12  ·  [B] Eqs. 8.1–8.3, 8.10  ·  Penn State FSC 432, “Ionic Chain Reactions”", "notes": "Lecture: Cracking and Reforming 1, supplied course PDF, pp. 11–12. Fahim, M. A., Al-Sahhaf, T. A., and Elkilani, A. S. (2010). Fundamentals of Petroleum Refining. Elsevier. Chapter 8, pp. 199–235. Printed page numbers are used. PDF page = printed page + 17., equations 8.1–8.3 and 8.10, pp. 204–205. Supplement: Semih Eser, Penn State FSC 432, Ionic Chain Reactions, https://courses.ems.psu.edu/fsc432/node/721 (accessed 29 September 2026). H–Z denotes a Brønsted acid site and Z− the conjugate framework site. The equations illustrate the olefin/carbenium route: protonation, beta scission, hydride transfer and proton return. Initial olefins may come from mild thermal cracking. Direct paraffin activation and carbonium-ion paths also exist. Beta scission breaks the C–C bond between the alpha and beta carbons relative to the charged carbon, creating an olefin and a smaller carbenium ion. Rearrangements via hydride/alkyl shifts favour more stable secondary/tertiary ions and help explain branched products. Hydride transfer propagates the ionic chain, whereas deprotonation restores a Brønsted site. Carbonium and carbenium are distinguished in modern terminology; the lecture sometimes uses carbonium broadly."}, {"title": "Riser reactor", "section": "07 · Reactor design", "source": "[L] pp. 13, 16  ·  [B] §§8.9–8.10; Example E8.4, p. 224", "notes": "Lecture: Cracking and Reforming 1, supplied course PDF, pp. 13 and 16. Fahim, M. A., Al-Sahhaf, T. A., and Elkilani, A. S. (2010). Fundamentals of Petroleum Refining. Elsevier. Chapter 8, pp. 199–235. Printed page numbers are used. PDF page = printed page + 17., sections 8.9–8.10 and Example E8.4, printed p. 224 (PDF p. 241). Modern FCC performs most cracking in a dilute-phase riser; the regenerator uses a turbulent fluidised bed and the stripper uses steam contacting. The illustrated height 33 m and inside diameter 0.8 m come from the book's modelling example, not a universal size or a fabrication recommendation. Its catalyst and feed rates are 144 and 20 kg/s respectively, so C/O=7.2, different from Table 8.4 on slide 4. Geometry is set by capacity, gas expansion, velocity, residence time and solids circulation. The approximate plug-flow description is a modelling simplification. Rapid catalyst/vapour separation limits overcracking. The scale of vessel drawings is schematic."}, {"title": "Products and by-products", "section": "08 · Product slate", "source": "[B] Table 8.2, p. 202  ·  Yield ranges are independent examples, not one mass balance", "notes": "Fahim, M. A., Al-Sahhaf, T. A., and Elkilani, A. S. (2010). Fundamentals of Petroleum Refining. Elsevier. Chapter 8, pp. 199–235. Printed page numbers are used. PDF page = printed page + 17., Table 8.2, p. 202. The tabulated ranges are indicative ranges across operating/feed cases, not simultaneous numbers that should sum to 100%. The book's combined dry gas + H2S category is retained as a yield category; usual refinery dry gas is primarily H2 and C1–C2, with composition affected by the separation cut. Gasoline is a blending component and may require sulfur reduction. LCO is aromatic and generally requires treatment/upgrading for diesel use. HCO/slurry are heavy aromatic streams with catalyst fines. Coke is deposited on catalyst and consumed in the regenerator; it is not recovered as a saleable FCC product. CO2/CO, SOx, NOx and catalyst fines are potential regeneration emissions requiring control, rather than part of the hydrocarbon yield basis."}, {"title": "Optimization and references", "section": "09 · Operating choices and sources", "source": "Source keys throughout: [L] supplied lecture PDF pages  ·  [B] textbook printed pages", "notes": "Lecture: Cracking and Reforming 1, supplied course PDF, pp. 15–17, 20, 24. Fahim, M. A., Al-Sahhaf, T. A., and Elkilani, A. S. (2010). Fundamentals of Petroleum Refining. Elsevier. Chapter 8, pp. 199–235. Printed page numbers are used. PDF page = printed page + 17., sections 8.5–8.7, 8.9, 8.12 and 8.16. This slide synthesises engineering trade-offs from the sources rather than claiming a universal optimum. Higher severity raises conversion but can consume gasoline to make gas and coke. ZSM-5 raises light olefin production and can sacrifice gasoline yield. Good feed atomisation and rapid separation improve selectivity. Catalyst/oil ratio, regenerated catalyst temperature and feed preheat are coupled by the heat balance. Optimization must respect air blower, wet gas compressor, regenerator temperature, catalyst circulation and emission limits. Check actual plant yields and product quality before choosing setpoints. Full references and source/page mapping accompany this presentation. Additional mechanism source: https://courses.ems.psu.edu/fsc432/node/721."}];
