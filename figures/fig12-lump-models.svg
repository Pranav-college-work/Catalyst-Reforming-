<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" role="img" aria-labelledby="t d">
<title id="t">Three-lump and four-lump kinetic models of FCC</title>
<desc id="d">Three-lump: VGO to gasoline (k1), gasoline to gas plus coke (k2), VGO to gas plus coke (k3). Four-lump: VGO to gasoline (k12), gas (k13) and coke (k14); gasoline to gas (k23) and coke (k24).</desc>
<style>
  text{font-family:"Segoe UI",Arial,Helvetica,sans-serif;fill:#1E2329}
  .n{stroke:#1E2329;stroke-width:2}
  .nt{font-size:15px;font-weight:700;text-anchor:middle}
  .ns{font-size:12.5px;text-anchor:middle;fill:#3A4048}
  .a{stroke:#1E2329;stroke-width:2.4;fill:none}
  .k{font-size:15px;font-weight:700;font-style:italic;fill:#1F5FAF;text-anchor:middle}
  .h{font-size:17px;font-weight:700;text-anchor:middle}
</style>
<defs>
  <marker id="m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E2329"/></marker>
</defs>
<rect width="1100" height="340" fill="#FFFFFF"/>
<line x1="530" y1="20" x2="530" y2="320" stroke="#E2DFD8" stroke-width="1.5"/>

<text class="h" x="265" y="36">Three-lump model</text>
<rect class="n" x="30"  y="150" width="120" height="56" rx="8" fill="#F6ECE3"/><text class="nt" x="90"  y="176">VGO</text><text class="ns" x="90" y="194">y₁</text>
<rect class="n" x="205" y="150" width="120" height="56" rx="8" fill="#E3F2E9"/><text class="nt" x="265" y="176">Gasoline</text><text class="ns" x="265" y="194">y₂</text>
<rect class="n" x="380" y="150" width="120" height="56" rx="8" fill="#EEF1F4"/><text class="nt" x="440" y="176">Gas + coke</text><text class="ns" x="440" y="194">y₃</text>
<path class="a" d="M150,178 L203,178" marker-end="url(#m)"/><text class="k" x="176" y="168">k₁</text>
<path class="a" d="M325,178 L378,178" marker-end="url(#m)"/><text class="k" x="351" y="168">k₂</text>
<path class="a" d="M90,150 C90,70 440,70 440,148" marker-end="url(#m)"/><text class="k" x="265" y="80">k₃</text>
<text class="ns" x="265" y="258">VGO cracking: 2nd order · gasoline cracking: 1st order</text>
<text class="ns" x="265" y="278">fitted at 548.9 °C, C/O = 4: k₁ = 23, k₂ = 3.1, k₃ = 7.5 h⁻¹</text>

<text class="h" x="815" y="36">Four-lump model</text>
<rect class="n" x="560" y="130" width="120" height="56" rx="8" fill="#F6ECE3"/><text class="nt" x="620" y="156">VGO</text><text class="ns" x="620" y="174">y₁</text>
<rect class="n" x="750" y="130" width="120" height="56" rx="8" fill="#E3F2E9"/><text class="nt" x="810" y="156">Gasoline</text><text class="ns" x="810" y="174">y₂</text>
<rect class="n" x="940" y="130" width="120" height="56" rx="8" fill="#EEF1F4"/><text class="nt" x="1000" y="156">Gas</text><text class="ns" x="1000" y="174">y₃</text>
<rect class="n" x="750" y="250" width="120" height="56" rx="8" fill="#E9E6E1"/><text class="nt" x="810" y="276">Coke</text><text class="ns" x="810" y="294">y₄</text>
<path class="a" d="M680,158 L748,158" marker-end="url(#m)"/><text class="k" x="714" y="148">k₁₂</text>
<path class="a" d="M870,158 L938,158" marker-end="url(#m)"/><text class="k" x="904" y="148">k₂₃</text>
<path class="a" d="M620,130 C620,58 1000,58 1000,128" marker-end="url(#m)"/><text class="k" x="810" y="68">k₁₃</text>
<path class="a" d="M620,186 L620,278 L748,278" marker-end="url(#m)"/><text class="k" x="600" y="240">k₁₄</text>
<path class="a" d="M810,186 L810,248" marker-end="url(#m)"/><text class="k" x="832" y="224">k₂₄</text>
<text x="1080" y="330" font-size="11.5" text-anchor="end" fill="#5A616A">After Fahim et al. (2010) Figs 8.9, 8.10 and Ex. E8.3</text>
</svg>
