<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">Carbenium-ion chain: beta-scission, rearrangement and hydride transfer</title>
<desc id="d">A secondary C7 carbenium ion breaks at the bond beta to the charged carbon, giving propene and a primary C4 carbenium ion. The primary ion rearranges to the tertiary butyl ion, which takes a hydride from n-octane to give isobutane and a new C8 carbenium ion.</desc>
<style>
  text{font-family:"Segoe UI",Arial,Helvetica,sans-serif;fill:#1E2329}
  .b{stroke:#1E2329;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .h{font-size:17px;font-weight:700}
  .c{font-size:13px;text-anchor:middle;fill:#3A4048}
  .cb{font-size:14px;text-anchor:middle;font-weight:600}
  .gr{font-size:17px;font-weight:700;font-style:italic;fill:#1F5FAF}
</style>
<defs>
  <marker id="m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E2329"/></marker>
  <g id="plus"><circle r="11" fill="#C0392B"/><path d="M-5.5,0 H5.5 M0,-5.5 V5.5" stroke="#fff" stroke-width="2.4"/></g>
</defs>
<rect width="1200" height="520" fill="#FFFFFF"/>

<text class="h" x="40" y="40">① β-scission of a secondary C₇ carbenium ion (from n-octane cracking)</text>
<!-- C7 ion -->
<polyline class="b" points="80,150 140,110 200,150 260,110 320,150 380,110 440,150"/>
<use href="#plus" x="140" y="110"/>
<text class="gr" x="193" y="178">α</text>
<text class="gr" x="253" y="96">β</text>
<line x1="206" y1="96" x2="254" y2="164" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="232" y="198" font-size="12.5" text-anchor="middle" fill="#9E2A1E" font-weight="600">bond β to C⁺ breaks</text>
<text class="c" x="260" y="232">secondary carbenium ion  C₇H₁₅⁺</text>

<path d="M480,130 L580,130" stroke="#1E2329" stroke-width="2.5" marker-end="url(#m)"/>
<text x="530" y="118" font-size="14" text-anchor="middle" font-weight="600">β-scission</text>

<!-- propene -->
<polyline class="b" points="620,150 680,110 740,150"/>
<line x1="684" y1="124" x2="728" y2="153" stroke="#1E2329" stroke-width="3" stroke-linecap="round"/>
<text class="c" x="680" y="190">propene  C₃H₆</text>
<text class="c" x="680" y="207">(olefin, LPG range)</text>
<text x="790" y="142" font-size="28" text-anchor="middle">+</text>
<!-- primary C4 ion -->
<polyline class="b" points="840,110 900,150 960,110 1020,150"/>
<use href="#plus" x="840" y="110"/>
<text class="c" x="930" y="190">primary carbenium ion  C₄H₉⁺</text>
<text class="c" x="930" y="207">(unstable: rearranges)</text>

<line x1="40" y1="250" x2="1160" y2="250" stroke="#E2DFD8" stroke-width="1.5"/>
<text class="h" x="40" y="286">② Rearrangement to the most stable ion, then ③ hydride transfer propagates the chain</text>

<!-- primary C4 -->
<polyline class="b" points="70,350 120,380 170,350 220,380"/>
<use href="#plus" x="70" y="350"/>
<text class="c" x="145" y="420">1° C₄H₉⁺</text>
<path d="M250,365 L345,365" stroke="#1E2329" stroke-width="2.5" marker-end="url(#m)"/>
<text x="297" y="352" font-size="13" text-anchor="middle" font-weight="600">H⁻ / CH₃⁻ shifts</text>
<text x="297" y="388" font-size="13" text-anchor="middle">1° → 2° → 3°</text>
<!-- tert-butyl -->
<line class="b" x1="430" y1="370" x2="430" y2="318"/><line class="b" x1="430" y1="370" x2="385" y2="396"/><line class="b" x1="430" y1="370" x2="475" y2="396"/>
<use href="#plus" x="430" y="370"/>
<text class="cb" x="430" y="428">tertiary ion (CH₃)₃C⁺</text>
<text class="c" x="430" y="446">most stable</text>

<path d="M520,365 L640,365" stroke="#1E2329" stroke-width="2.5" marker-end="url(#m)"/>
<text x="580" y="352" font-size="13" text-anchor="middle" font-weight="600">+ n-C₈H₁₈</text>
<text x="580" y="388" font-size="13" text-anchor="middle">hydride (H⁻) transfer</text>
<!-- isobutane -->
<line class="b" x1="720" y1="370" x2="720" y2="318"/><line class="b" x1="720" y1="370" x2="675" y2="396"/><line class="b" x1="720" y1="370" x2="765" y2="396"/>
<circle cx="720" cy="370" r="4" fill="#1E2329"/>
<text class="cb" x="720" y="428">isobutane  i-C₄H₁₀</text>
<text class="c" x="720" y="446">(iso-paraffin in product)</text>
<text x="805" y="378" font-size="28" text-anchor="middle">+</text>
<text x="880" y="378" font-size="22" font-weight="700" text-anchor="middle">C₈H₁₇⁺</text>
<text class="c" x="880" y="410">new carbenium ion</text>
<text class="c" x="880" y="428">→ cracks again (chain)</text>

<g transform="translate(990,305)">
  <rect width="180" height="110" rx="8" fill="#FAF3EF" stroke="#D9B6A6"/>
  <text x="90" y="28" font-size="13" text-anchor="middle" font-weight="700">Ion stability</text>
  <text x="90" y="62" font-size="22" text-anchor="middle" font-weight="700" fill="#9E2A1E">3° &gt; 2° &gt; 1°</text>
  <text x="90" y="90" font-size="12" text-anchor="middle" fill="#3A4048">explains the branched</text>
  <text x="90" y="104" font-size="12" text-anchor="middle" fill="#3A4048">(iso) products</text>
</g>
<text x="1160" y="505" font-size="12" text-anchor="end" fill="#5A616A">After lecture pp. 11–12 (n-octane, steps 1–5) and Fahim et al. (2010) Eqs 8.1–8.3, 8.10</text>
</svg>
