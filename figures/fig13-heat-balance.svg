<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d">
<title id="t">Reactor–regenerator heat balance</title>
<desc id="d">Coke burned in the regenerator releases heat; hot regenerated catalyst carries it to the riser where it heats and vaporises the feed and supplies the endothermic heat of cracking; spent catalyst carrying coke returns to the regenerator.</desc>
<style>
  text{font-family:"Segoe UI",Arial,Helvetica,sans-serif;fill:#1E2329}
  .h{font-size:19px;font-weight:700;text-anchor:middle}
  .s{font-size:13.5px;text-anchor:middle;fill:#2B3036}
  .rcat{stroke:#C0392B;stroke-width:7;fill:none}
  .scat{stroke:#4B4F55;stroke-width:7;fill:none}
</style>
<defs>
  <marker id="mr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  <marker id="ms" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B4F55"/></marker>
  <marker id="ma" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F5FAF"/></marker>
  <marker id="mf" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7D848C"/></marker>
  <marker id="mo" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9A4B12"/></marker>
  <marker id="mv" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B7F4B"/></marker>
</defs>
<rect width="1000" height="500" fill="#FFFFFF"/>

<rect x="90" y="130" width="300" height="210" rx="12" fill="#FCE6DC" stroke="#1E2329" stroke-width="2"/>
<text class="h" x="240" y="168">Regenerator</text>
<text class="s" x="240" y="196">coke + O₂ → CO₂ (+ CO)</text>
<text class="s" x="240" y="220" font-weight="700" fill="#9E2A1E">EXOTHERMIC: heat source</text>
<text class="s" x="240" y="250">heats air → flue gas</text>
<text class="s" x="240" y="272">re-heats catalyst T<tspan dy="4" font-size="10">R</tspan><tspan dy="-4"> → </tspan>T<tspan dy="4" font-size="10">Reg</tspan><tspan dy="-4"></tspan></text>
<text class="s" x="240" y="310" font-weight="600">T<tspan dy="4" font-size="10">Reg</tspan><tspan dy="-4"> ≈ 690–700 °C (Ex. E8.2)</tspan></text>

<rect x="610" y="130" width="300" height="210" rx="12" fill="#E3F2E9" stroke="#1E2329" stroke-width="2"/>
<text class="h" x="760" y="168">Riser reactor</text>
<text class="s" x="760" y="196">cracking of gas oil</text>
<text class="s" x="760" y="220" font-weight="700" fill="#1B6A40">ENDOTHERMIC: heat sink</text>
<text class="s" x="760" y="250">heat + vaporise the feed</text>
<text class="s" x="760" y="272">supply ΔH of reaction, heat steam</text>
<text class="s" x="760" y="310" font-weight="600">T<tspan dy="4" font-size="10">R</tspan><tspan dy="-4"> ≈ 520 °C (Ex. E8.2)</tspan></text>

<path class="rcat" d="M390,178 L604,178" marker-end="url(#mr)"/>
<text x="500" y="160" font-size="14" font-weight="700" text-anchor="middle" fill="#9E2A1E">hot regenerated catalyst</text>
<text x="500" y="202" font-size="12.5" text-anchor="middle" fill="#3A4048">carries the heat</text>
<path class="scat" d="M610,292 L396,292" marker-end="url(#ms)"/>
<text x="500" y="276" font-size="12.5" text-anchor="middle" fill="#3A4048">carries the fuel</text>
<text x="500" y="320" font-size="14" font-weight="700" text-anchor="middle" fill="#3A3F45">spent catalyst + coke</text>
<text x="500" y="244" font-size="15" font-weight="800" text-anchor="middle">catalyst = heat carrier</text>

<path d="M240,420 L240,344" stroke="#1F5FAF" stroke-width="3" marker-end="url(#ma)"/>
<text x="252" y="410" font-size="13">air</text>
<path d="M240,130 L240,62" stroke="#7D848C" stroke-width="3.5" stroke-dasharray="9 5" marker-end="url(#mf)"/>
<text x="252" y="80" font-size="13">flue gas: CO₂, CO, H₂O, N₂, O₂</text>
<path d="M760,420 L760,344" stroke="#9A4B12" stroke-width="3" marker-end="url(#mo)"/>
<text x="772" y="410" font-size="13">feed oil + steam</text>
<path d="M760,130 L760,62" stroke="#1B7F4B" stroke-width="3" marker-end="url(#mv)"/>
<text x="772" y="80" font-size="13">cracked vapour at T<tspan dy="4" font-size="10">R</tspan><tspan dy="-4"></tspan></text>

<rect x="90" y="440" width="820" height="46" rx="8" fill="#FAFAF8" stroke="#C9C6BF"/>
<text x="500" y="468" font-size="14" text-anchor="middle"><tspan font-weight="700">Steady state:</tspan> heat released by burning coke = heat absorbed in the reactor (+ losses). Coke make is set by this balance.</text>
</svg>
